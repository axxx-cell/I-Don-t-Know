name: Build and Deploy Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip the game
        run: |
          mkdir -p _site
          unzip -q blind-depths.zip -d _tmp
          cp -r _tmp/blind-depths/. _site/
          ls -R _site

      - name: Check JavaScript for syntax errors
        run: |
          for f in _site/js/*.js; do
            node --check "$f" && echo "OK $f"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
