name: Build Android APK

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip the game into www
        run: |
          mkdir -p www _tmp
          unzip -q blind-depths.zip -d _tmp
          cp -r _tmp/blind-depths/. www/
          ls -R www

      - name: Apply update zip
        run: |
          if [ -f blind-depths-update.zip ]; then
            unzip -oq blind-depths-update.zip -d _upd
            cp -r _upd/blind-depths/. www/
          fi

      - name: Check JavaScript for syntax errors
        run: |
          for f in www/js/*.js; do node --check "$f" && echo "OK $f"; done

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Blind Depths" com.blinddepths.game --web-dir www
          npx cap add android

      - name: Landscape, fullscreen, keep screen on
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/blinddepths/game/MainActivity.java <<'EOF'
          package com.blinddepths.game;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              hideBars();
            }
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }
            private void hideBars() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                View.SYSTEM_UI_FLAG_FULLSCREEN |
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
            }
          }
          EOF
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blind-depths-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Blind Depths (latest APK)
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
